services:
  prd-builder:
    build: .
    ports:
      - "3000:3000"
    # ANTHROPIC_API_KEY, OPENROUTER_API_KEY
    # No Cloudflare Access here: the container runs in production mode, so DEV_USER_EMAIL is ignored and
    # every page redirects to /signin. For local use run `npm run dev` instead; this file is for build checks.
    env_file:
      - .env.local
    environment:
      DATABASE_URL: file:/app/db/dev.db
    volumes:
      - prd-db:/app/db            # SQLite database
      - prd-data:/app/data        # saved PRDs, design jobs, mockups
      # The skill and the cloned Blackbuck repos the app reads. Not baked into the
      # image: they are internal and this repo is public.
      - ${HOME}/blackbuck-workspace:/home/node/blackbuck-workspace
volumes:
  prd-db:
  prd-data:
